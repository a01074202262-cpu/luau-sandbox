services:
  - type: web
    name: luau-sandbox
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LUAU_PATH
        value: /usr/local/bin/luau
      - key: TIME_LIMIT_MS
        value: "5000"
      - key: CODE_LIMIT_KB
        value: "100"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: MAX_CONCURRENT
        value: "4"
